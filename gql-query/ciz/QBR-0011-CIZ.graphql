# qbr-0011-CIZ.graphql
# Query voor CIZ op Bemiddelingsregister t.b.v ophalen uitvoerende zorgkantoren
# Verplichte input:
# - wlzIndicatieID
#

query Bemiddeling(
    $wlzIndicatieID: UUID!
){
    bemiddeling(
        where: { 
            wlzIndicatieID: { eq: $wlzIndicatieID }
        }
    ) {
        wlzIndicatieID
        bemiddelingspecificatie {
            uitvoerendZorgkantoor
        }
    }
}
