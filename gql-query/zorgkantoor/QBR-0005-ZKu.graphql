# QBR-0005-ZKu.graphql
# Query voor uitvoerend Zorgkantoor op Bemiddelingsregister
# Verplichte input:
#   - bemiddelingspecificatieID
#   - uzovi code zorgkantoor
#   - toewijzing Ingangsdatum bijv. 2020-02-19
#   - vaststelling moment bijv. 2020-02-09T13:47:16.000+01:00
#   - dag vaststelling moment bijv. 2020-02-09
#   - toewijzing Einddatum bijv. 2024-03-17


query Bemiddelingspecificatie(
    $bemiddelingspecificatieID: UUID!
    $uitvoerendZorgkantoor: String!
    $toewijzingIngangsdatum: Date!
    $vaststellingMoment: DateTime!
    $dagVaststellingMoment: Date! 
    $toewijzingEinddatum: Date!
   ) {
    bemiddelingspecificatie(
        where: {
            bemiddelingspecificatieID: { eq: $bemiddelingspecificatieID }
            uitvoerendZorgkantoor: { eq: $uitvoerendZorgkantoor }
            toewijzingIngangsdatum: { eq: $toewijzingIngangsdatum }
            vaststellingMoment: { eq: $vaststellingMoment }
            toewijzingEinddatum: { eq: $toewijzingEinddatum }
        }
    ) {
        bemiddelingspecificatieID
        leveringsvorm
        zzpCode
        toewijzingIngangsdatum
        toewijzingEinddatum
        instelling
        uitvoerendZorgkantoor
        vaststellingMoment
        percentage
        opname
        redenIntrekking
        etmalen
        instellingBestemming
        soortToewijzing
        bemiddeling {
            bemiddelingID
            wlzIndicatieID
            verantwoordelijkZorgkantoor
            verantwoordelijkheidIngangsdatum
            verantwoordelijkheidEinddatum
            client {
                bsn
                contactpersoon(
                    where: {
                        and: [
                                {
                                    or: [{ einddatum: { eq: null } }, 
                                    { einddatum: { gte: $toewijzingIngangsdatum } },
                                    { einddatum: { gte: $dagVaststellingMoment } }]
                                }
                                { ingangsdatum: { ngt: $toewijzingEinddatum } }
                            ]
                    }
                ) {
                    contactpersoonID
                    relatienummer
                    volgorde
                    soortRelatie
                    rol
                    relatie
                    geslachtsnaam
                    voorvoegselGeslachtsnaam
                    partnernaam
                    voorvoegselPartnernaam
                    voornamen
                    voorletters
                    roepnaam
                    naamgebruik
                    geslacht
                    geboortedatum
                    geboortedatumgebruik
                    ingangsdatum
                    einddatum
                    contactgegevens(
                        where: {
                            and:  [
                            {
                                or: [{ einddatum: { eq: null } }, 
                                { einddatum: { gte: $toewijzingIngangsdatum } },
                                { einddatum: { gte: $dagVaststellingMoment } }]
                            }
                            { ingangsdatum: { ngt: $toewijzingEinddatum } }
                        ]
                        }
                    ) {
                        contactpersoonContactgegevensID
                        adressoort
                        straatnaam
                        huisnummer
                        huisletter
                        huisnummertoevoeging
                        postcode
                        plaatsnaam
                        land
                        aanduidingWoonadres
                        emailadres
                        telefoonnummer01
                        landnummer01
                        telefoonnummer02
                        landnummer02
                        ingangsdatum
                        einddatum
                    }
                }
                leefeenheid
                huisarts
                communicatievorm
                taal
                contactgegevens(
                    where: {
                        and: [
                            {
                                or: [{ einddatum: { eq: null } }, 
                                { einddatum: { gte: $toewijzingIngangsdatum } },
                                { einddatum: { gte: $dagVaststellingMoment } }]
                            }
                            { ingangsdatum: { ngt: $toewijzingEinddatum } }
                        ]
                    }
                ) {
                    clientContactgegevensID
                    adressoort
                    straatnaam
                    huisnummer
                    huisletter
                    huisnummertoevoeging
                    postcode
                    plaatsnaam
                    land
                    aanduidingWoonadres
                    emailadres
                    telefoonnummer01
                    landnummer01
                    telefoonnummer02
                    landnummer02
                    ingangsdatum
                    einddatum
                }
                clientID
            }
            bemiddelingspecificatie(
                    where: {
                        and: [
                            {
                                or: [{ toewijzingEinddatum: { eq: null } }, 
                                { toewijzingEinddatum: { gte: $toewijzingIngangsdatum } },
                                { toewijzingEinddatum: { gte: $dagVaststellingMoment } }]
                            }
                            { toewijzingIngangsdatum: { ngt: $toewijzingEinddatum } }
                        ]
                    }
                ) {
                bemiddelingspecificatieID
                leveringsvorm
                zzpCode
                toewijzingIngangsdatum
                toewijzingEinddatum
                instelling
                uitvoerendZorgkantoor
                vaststellingMoment
                percentage
                pgbPercentage
                opname
                redenIntrekking
                etmalen
                instellingBestemming
                soortToewijzing
            }
            regiehouder(
                    where: {
                        and: [
                            {
                                or: [{ einddatum: { eq: null } }, 
                                { einddatum: { gte: $toewijzingIngangsdatum } },
                                { einddatum: { gte: $dagVaststellingMoment } }]
                            }
                            { ingangsdatum: { ngt: $toewijzingEinddatum } }
                        ]
                    }
                ) {
                    regiehouderID
                    instelling
                    ingangsdatum
                    einddatum
                    regierol
                }
        }
    }
}
