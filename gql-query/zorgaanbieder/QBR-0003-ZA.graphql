# QBR-0003-ZA.grapql
# Query voor Zorgaanbieder op Bemiddelingsregister
# Verplichte input:
#   - bemiddelingspecificatieID - eigen bemiddelingsspecificatie
#   - agbcode instelling
#   - toewijzing Ingangsdatum bijv. 2020-02-19
#   - vaststelling moment bijv. 2020-02-09T13:47:16.000+01:00
#   - dag vaststelling moment bijv. 2020-02-09


query Bemiddelingspecificatie(
  $bemiddelingspecificatieID: UUID!
  $instelling: String!
  $toewijzingIngangsdatum: Date!
  $vaststellingMoment: DateTime!
  $dagVaststellingMoment: Date!

) {
  # Eigen bemiddelingspecificatie
  bemiddelingspecificatie(
    where: {
      bemiddelingspecificatieID: { eq: $bemiddelingspecificatieID }
      instelling: { eq: $instelling }
      toewijzingIngangsdatum: { eq: $toewijzingIngangsdatum }
      vaststellingMoment: { eq: $vaststellingMoment } 
      toewijzingEinddatum: { eq: null }
    }
  ) {
    bemiddelingspecificatieID
    leveringsvorm
    zzpCode
    toewijzingIngangsdatum
    toewijzingEinddatum
    instelling
    uitvoerendZorgkantoor
    vaststellingMoment
    percentage
    opname
    redenIntrekking
    etmalen
    instellingBestemming
    soortToewijzing
    # Bemiddeling
    bemiddeling {
      bemiddelingID
      wlzIndicatieID
      verantwoordelijkZorgkantoor
      verantwoordelijkheidIngangsdatum
      verantwoordelijkheidEinddatum
      # Client
      client {
        bsn
        # Contactpersoon
        contactpersoon(
          where: {
            and: [
              {
                or: [
                  { einddatum: { eq: null } }
                  { einddatum: { gte: $toewijzingIngangsdatum } }
                  { einddatum: { gte: $dagVaststellingMoment } }
                ]
              }
            ]
          }
        ) {
          contactpersoonID
          relatienummer
          volgorde
          soortRelatie
          rol
          relatie
          geslachtsnaam
          voorvoegselGeslachtsnaam
          partnernaam
          voorvoegselPartnernaam
          voornamen
          voorletters
          roepnaam
          naamgebruik
          geslacht
          geboortedatum
          geboortedatumgebruik
          ingangsdatum
          einddatum
          # Contactgegevens Contactpersoon
          contactgegevens(
            where: {
              and:  [
                {
                  or: [
                    { einddatum: { eq: null } }
                    { einddatum: { gte: $toewijzingIngangsdatum } }
                    { einddatum: { gte: $dagVaststellingMoment } }
                  ]
                }
              ]
            }
          ) {
            contactpersoonContactgegevensID
            adressoort
            straatnaam
            huisnummer
            huisletter
            huisnummertoevoeging
            postcode
            plaatsnaam
            land
            aanduidingWoonadres
            emailadres
            telefoonnummer01
            landnummer01
            telefoonnummer02
            landnummer02
            ingangsdatum
            einddatum
          }
        }
        leefeenheid
        huisarts
        communicatievorm
        taal
        # Contactgegevens Client
        contactgegevens(
          where: {
            and: [
              {
                or: [
                  { einddatum: { eq: null } }
                  { einddatum: { gte: $toewijzingIngangsdatum } }
                  { einddatum: { gte: $dagVaststellingMoment } }
                ]
              }
            ]
          }
        ) {
          clientContactgegevensID
          adressoort
          straatnaam
          huisnummer
          huisletter
          huisnummertoevoeging
          postcode
          plaatsnaam
          land
          aanduidingWoonadres
          emailadres
          telefoonnummer01
          landnummer01
          telefoonnummer02
          landnummer02
          ingangsdatum
          einddatum
        }
        clientID
      }
      # Overlappende bemiddelingspecificaties (informatieve zorgtoewijzingen)
      bemiddelingspecificatie(
        where: {
          and: [
            {
              or: [
                { toewijzingEinddatum: { eq: null } }
                { toewijzingEinddatum: { gte: $toewijzingIngangsdatum } }
                { toewijzingEinddatum: { gte: $dagVaststellingMoment } }
              ]
            }
          ]
        }
      ) {
        bemiddelingspecificatieID
        leveringsvorm
        zzpCode
        toewijzingIngangsdatum
        toewijzingEinddatum
        instelling
        uitvoerendZorgkantoor
        vaststellingMoment
        percentage
        opname
        redenIntrekking
        etmalen
        instellingBestemming
        soortToewijzing
      }
      regiehouder(
          where: {
            and: [
              {
                or: [
                  { einddatum: { eq: null } }
                  { einddatum: { gte: $toewijzingIngangsdatum } }
                  { einddatum: { gte: $dagVaststellingMoment } }
                ]
              }
            ]
          }
        ) {
          regiehouderID
          instelling
          ingangsdatum
          einddatum
          regierol
        }
    }
  }
}





