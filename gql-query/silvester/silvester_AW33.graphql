# QBR-silvester_AW33.graphql
# Query voor Silvester om de AW33 aan te kunnen maken
# Verplichte input:
#   - bemiddelingID = UUID
#   - selectiedatum = date
#   - vorigeSelectiemoment = datetime
# Selecteer van een Bemiddeling op basis van BemiddelingID
# 1. De Bemiddeling
# 2. De Bemiddelingspecificaties waarvan OF
#    a. Het vaststellingsmoment > het laatste selectiemoment
#    b. (einddatum = leeg OF einddatum >= selectiedatum) EN vaststellingsmoment <= vorigeSelectiemoment
# 3. De regiehouder waarvan EN
#    a. ingangsdatum <= selectiedatum
#    b. einddatum = leeg OF einddatum > selectiedatum
# 4. Client bij de Bemiddeling
# 5. ClientContactgegevens waarvan: einddatum = leeg OF einddatum >= selectiedatum
# 6. Contactpersoon waarvan: einddatum = leeg OF einddatum >= selectiedatum
# 7. ContactpersoonContactgegevens waarvan: einddatum = leeg OF einddatum >= selectiedatum

query Bemiddeling(
  $BemiddelingID: UUID!
  $vorigeSelectiemoment: DateTime!
  $Selectiedatum: Date!
) {
  bemiddeling(where: { bemiddelingID: { eq: $BemiddelingID } }) {
    bemiddelingID
    wlzIndicatieID
    verantwoordelijkZorgkantoor
    verantwoordelijkheidIngangsdatum
    verantwoordelijkheidEinddatum
    bemiddelingspecificatie(
      where: {
        or: [
          { vaststellingMoment: { gt: $vorigeSelectiemoment } }
          {
            and: [
              { vaststellingMoment: { lte: $vorigeSelectiemoment } }
              {
                or: [
                  { toewijzingEinddatum: { eq: null } }
                  { toewijzingEinddatum: { lte: $Selectiedatum } }
                ]
              }
            ]
          }
        ]
      }
    ) {
      bemiddelingspecificatieID
      leveringsvorm
      zzpCode
      toewijzingIngangsdatum
      toewijzingEinddatum
      instelling
      uitvoerendZorgkantoor
      vaststellingMoment
      percentage
      opname
      redenIntrekking
      etmalen
      instellingBestemming
      soortToewijzing
    }
    regiehouder(
      where: {
        and: [
          { ingangsdatum: { lte: $Selectiedatum } }
          {
            or: [
              { einddatum: { eq: null } }
              { einddatum: { gt: $Selectiedatum } }
            ]
          }
        ]
      }
    ) {
      regiehouderID
      instelling
      ingangsdatum
      einddatum
      regierol
    }
    client {
      clientID
      bsn
      contactpersoon(
        where: {
          or: [
            { einddatum: { eq: null } }
            { einddatum: { gte: $Selectiedatum } }
          ]
        }
      ) {
        contactpersoonID
        relatienummer
        volgorde
        soortRelatie
        rol
        relatie
        geslachtsnaam
        voorvoegselGeslachtsnaam
        partnernaam
        voorvoegselPartnernaam
        voornamen
        voorletters
        roepnaam
        naamgebruik
        geslacht
        geboortedatum
        geboortedatumgebruik
        ingangsdatum
        einddatum
        contactgegevens(
          where: {
            or: [
              { einddatum: { eq: null } }
              { einddatum: { gte: $Selectiedatum } }
            ]
          }
        ) {
          contactpersoonContactgegevensID
          adressoort
          straatnaam
          huisnummer
          huisletter
          huisnummertoevoeging
          postcode
          plaatsnaam
          land
          aanduidingWoonadres
          emailadres
          telefoonnummer01
          landnummer01
          telefoonnummer02
          landnummer02
          ingangsdatum
          einddatum
        }
      }
      leefeenheid
      huisarts
      communicatievorm
      taal
      contactgegevens(
        where: {
          or: [
            { einddatum: { eq: null } }
            { einddatum: { gte: $Selectiedatum } }
          ]
        }
      ) {
        clientContactgegevensID
        adressoort
        straatnaam
        huisnummer
        huisletter
        huisnummertoevoeging
        postcode
        plaatsnaam
        land
        aanduidingWoonadres
        emailadres
        telefoonnummer01
        landnummer01
        telefoonnummer02
        landnummer02
        ingangsdatum
        einddatum
      }
    }
  }
}
